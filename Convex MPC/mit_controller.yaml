# ===========================================================================
# Convex MPC 폴더 설정 = A30 (Q&A 9/30 Q23, 2026-10-01 발표 설정) + ymax 1.0.
# 기본값에서 바꾼 줄에는 "# A30 <변형 키> (원래 값)" 주석을 달았다.
# (디버깅 폴더 MPC/src/casadi_mit 는 기본값 yaml 에 같은 값을 --var 문자열로 덮어쓴다.)
# yaml 경로가 없는 A30 키 (컨트롤러 · 솔버 생성 인자) 는 맨 아래 launcher: 절에 있다.
# ===========================================================================
requested_locomotion_mode: walking  # requested startup mode: walking / standing / interactive

timing:
  cycle: 0.55       # A30 tcycle (0.5) — 걸음 주기
  swing: 0.22       # A30 tswing (0.17) — 스윙 시간. 이중 지지 = 2 × 입각 − 주기 = 0.11 s
  stance: 0.33000000000000007   # = cycle − swing 을 float 로 계산한 값 (0.33 으로 쓰면 원본 실행과 끝자리가 달라진다)
  horizon: 0.44     # A30 hor (0.5) — MPC 지평 [s]
  horizon_steps: 22 # = horizon / 0.02 (25) — 칸 간격 20 ms 유지

model:
  xml_path: models/mit_humanoid/scene.xml
  auxiliary_xml_path: models/mit_humanoid/mit_humanoid.xml
  foot_end_effector_source: site  # site or collision_geom_center
  gravity: -9.81

mpc:
  friction_coefficient: 1.0
  foot_half_length: 0.075   # A30 cop (0.065) — 선 발 반길이 l = 실제 접촉점 ±0.075
  foot_half_width: 0.01
  torsional_friction_scale: 0.0657
  normal_force_max: 500.0   # 9/26 Q5: 1500 은 비현실적 (사용자) — 0.6 걷기 실측 max 명령 Fz 486 N, 500 으로 제한
  normal_force_min: 5.0 # Could this cause MPC solve issues? Should this be 0 N instead?
  use_shifted_warm_start: true
  iterations_between_solve: 5   # A30 nbs (7) — 2 ms 틱 5 번마다 MPC 풀이 = 100 Hz
  # --- A30 에서 더한 MPC 키 (원본 yaml 에는 없음 = 0 / 끔) ---
  force_ref_weight: 1.0e-3      # A30 fref — 비용에 w·(Fz − m·g/n_디딤)² (Residual MPC 논문식 힘 참조)
  cop_margin_frac: 0.075        # A30 cmar — 서기: 두 점이 각각 Fz 의 ε 이상 → CoP 행 |My| ≤ (1 − 2ε)·l·Fz
  cop_margin_frac_walk: 0.1     # A30 cmarw — 걷기 전용 ε
  line_wrench_projection: 3     # A30 lproj — 걷기: MPC 해를 선 접촉 집합으로 자름 (yaw hold 를 더하기 전)
  line_wrench_projection_stand: 1   # A30 lprojs — 서기에서도 자름
  moment_variable_scale: 1      # A30 msc — 모멘트 변수를 l 로 나눠 풂 (해 같음, ADMM 25 회로 50 회 수준 정확도)
  walking:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [50000,  9000,  750,   200000,  1009300,  110000,     10,     10,     10,     100,    70,    10,   1 ]   # A30 qyaw: yaw 750 (500)
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
    # [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
  standing:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    # Keep the same baseline for now; tune this separately from walking later.
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [50000,  80000,   500,    50000,  90000,  50000,      10,     10,     10,     10,    10,    5,   1 ]
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4]

swing:
  natural_frequency: [69.46000000000001, 69.46000000000001, 50.6]   # A30 swwn 0.46 × [151, 151, 110] (float 곱 그대로)
  kd_diag: [25.0, 25.0, 25.0]   # kd_zeta 가 있으면 쓰지 않는다
  height: 0.06
  min_remaining_time: 0.001
  # 착지 미리보기 T_p = (0.5 + k_half)·T_입각. A30 khalf: 속도 구간 셋 모두 0.41 (0.37 / 0.28 / 0.26)
  body_velocity_half_stance_offset: 0.41
  mid_speed_body_velocity_half_stance_offset: 0.41
  body_velocity_half_stance_offset_switch_speed: 0.60
  high_speed_body_velocity_half_stance_offset: 0.41
  high_speed_body_velocity_half_stance_offset_switch_speed: 0.65
  swing_foot_yaw_lead_scale: 0.5   # A30 yawlead (1.0) — 착지 yaw = yaw + 0.5·ψ̇·T_p. 실행기 --yawlead 로 바꿀 수 있음
  enable_stance_foot_yaw_hold: true
  turn_tangential_lead_scale: 1.0
  nominal_foot_offsets_B:
    - [0.0, 0.075999602, 0.0] # [0.0, 0.075999602, 0.0]
    - [0.0, -0.075999602, 0.0]
  # Optional fixed override for the stop-braking offset added at touchdown.
  # Uncomment to replace the capture-point braking heuristic with a constant body-frame offset.
  # stop_braking_offset_B: [0.0, 0.0, 0.0]
  stop_capture_point_gain: 0.2
  stop_capture_point_max_offset: 0.08
  stop_velocity_deadband: 0.02
  stop_braking_latch_clear_ticks: 5
  # MIT humanoid is 5-DOF at the leg, so keep swing roll control disabled.
  roll_kp: 0.0
  roll_kd: 0.0
  pitch_kp: 300.0
  pitch_kd: 18.0
  yaw_kp: 305.0
  yaw_kd: 18.0
  stance_yaw_kp: 60.0   # A30 shkp (20) — 딛는 발 yaw hold m_z = kp·err − kd·rate (MPC 밖 관절 되먹임)
  stance_yaw_kd: 12.0   # A30 shkd (4)
  # --- A30 에서 더한 swing 키 (원본 yaml 에는 없음 = 끔) ---
  kd_zeta: 1.2                  # A30 kdz — 스윙 K_d = 2ζ·diag(Λ)·ω_n (kd_diag 대신)
  yaw_trajectory_fraction: 1.0  # A30 yawtraj — 스윙 발 yaw 를 스윙 전체에 걸친 최소 저크 궤적으로
  yaw_trajectory_ff: 2          # A30 yawff — 그 궤적의 속도 목표에서 명령 ψ̇ 를 뺀다
  step_vdir_blend: 0.7          # A30 vdir — 착지 앞먹임 v·T_p 의 방향만 실측 진행 방향 쪽으로 70 % (크기는 명령)
  raibert_vel_wholebody: 1      # A30 rvwb — 착지 되먹임 속도 = 전신 CoM 속도 (몸통 속도엔 스윙 반동이 섞임)
  replan: 1                     # A30 replan — 스윙 중 착지점을 매 틱 다시 계산
  replan_freeze: 0.08           # A30 rpfz — 스윙 마지막 80 ms 는 고정
  min_step_width: 0.1           # A30 minw — 딛고 있는 발에서 옆으로 최소 10 cm (발 꼬임 방지)
  psi_offset_scale: 0.0         # A30 psioff (1) — 회전 때 앞발 벌림 끔 (무릎 충돌을 residual 관찰 포인트로 남김)
  k_sched_fast_x: 0.35          # A30 ksx — 곧게 빨리 걸을 때 전진 k_half 를 0.35 쪽으로 (|v_x|/0.8 비율)
  k_sched_lat_y: 0.47           # A30 ksy — 옆으로 걸을 때 옆 k_half 를 0.47 쪽으로 (|v_y|/0.5 비율). |ψ̇| ≥ 0.5 면 둘 다 0.41
  stance_yaw_fade_rate: 2.0     # A30 shw — |ψ̇| 가 2.0 에 가까울수록 yaw hold 이득을 20 / 4 로 푼다
  stance_yaw_rate_absolute: 1   # A30 shabs — yaw hold 감쇠에 발의 절대 yaw 각속도 (몸통 기준 상대 속도 대신)

user_command_filter:
  x_dot_tau: 0.92
  y_dot_tau: 0.8
  psi_dot_tau: 0.70
  standing_roll_offset_tau: 0.70
  standing_pitch_offset_tau: 0.70
  x_dot_max: 1.0    # A30 xmax (0.7) — 명령 상한
  y_dot_max: 1.0    # ymax (0.5) — 옆 0.8 m/s 를 자르지 않게 (발표 폴더에서 추가)
  psi_dot_max: 2.5  # A30 wmax (2.0)

reference_trajectory:
  # single_support: legacy behavior, double_support: only when both feet are stance, always: integrate every step
  yaw_integration_mode: always

contact_manager:
  contact_force_on_threshold: 36.0
  contact_force_off_threshold: 0.5
  contact_on_confirm_ticks: 1
  contact_off_confirm_ticks: 4
  contact_ramp_duration: 0.01
  contact_lock_steps: 1
  late_contact_timeout: 0.20
  ground_search_velocity: 0.40
  ground_search_max_depth: 0.15
  ground_search_tracking_time: 0.08
  stance_contact_loss_foot_height: 0.060
  enable_early_contact_handling: true
  enable_late_contact_handling: false

logging:
  standing_mpc_debug_trigger_times: []

startup:
  # If requested_locomotion_mode is walking, hold standing MPC this long after leg PD init before gait starts.
  post_init_standing_settle_time: 1.0

locomotion_transition:
  # In interactive mode, walking -> standing first zeroes the motion command.
  # Stay in the low-motion settle phase until moving-average body speed and yaw rate
  # have been slow for this many ticks, then wait for either this timeout or this many
  # touchdown events.
  braking_settle_speed_threshold: 0.01
  braking_settle_yaw_rate_threshold: 0.01
  braking_settle_average_window: 1.0
  braking_settle_hold_ticks: 3
  braking_timeout_seconds: 3.0
  braking_touchdown_count: 5

joint_tracking:
  leg:
    # MIT humanoid order: [hip_yaw, hip_abad, hip_pitch, knee, ankle]
    kp: [70.0, 50.0, 100.0, 100.0, 200.0]
    kd: [15.0, 10.0, 10.0, 10.0, 30.0]
  arm:
    # MIT humanoid order: [shoulder_pitch, shoulder_abad, shoulder_yaw, elbow]
    kp: [100.0, 100.0, 100.0, 100.0]
    kd: [5.0, 5.0, 5.0, 5.0]

initial_pose:
  # Floating-base pose from the scene keyframe. Used once to seed the reduced-body target.
  base_position_W: [0.0, 0.0, 0.679472]  # 0.625972 / 0.679472
  base_rpy_W: [0.0, 0.0, 0.0]
  leg_initialization_time: 2.0
  arm_initialization_time: 1.0
  leg_joint_offsets: [0, 0, -0.735, 1.2, -0.70]
  arm_joint_offsets: [0.0, 0.0, 0.0, -1.65]

gait_swing_hold_test:
  xml_path: models/mit_humanoid/scene_test.xml
  keyframe_name: copied_state

# ---------------------------------------------------------------------------
# port: 시뮬레이션 · 실행 설정 (시작 자세, 모터 관성, QP 솔버, 물리 틱).
# ---------------------------------------------------------------------------
port:
  # 시작 자세 = 모델의 keyframe "stand" (발 평평, 전신 CoM 위, base z 0.679472).
  #     qpos0 에서 떨어뜨려 2 s 관절 PD 로 자세를 잡으면 이 모델은 넘어진다.
  spawn_keyframe: stand
  # 2 s 다리 PD 초기화 생략 — 컨트롤러가 t = 0 에서 StandingSettle 로 시작 (1.0 s 후 Walking).
  skip_leg_pd_init: true
  # URDF rotor_inertia 를 MuJoCo armature 로 사용. false 면 armature 0 (민감도 확인용).
  armature: true
  # MPC QP 솔버. osqp (ADMM) | quadprog (정확한 QP 비교용).
  solver: osqp
  # 물리 틱 0.002 s (= 컨트롤러 틱), implicitfast (로드 시 덮어씀).
  physics_dt: 0.002
  integrator: implicitfast
  # 디버그 마커 mocap 바디 질량 (≈0.21 kg) 을 축소 몸체에 더할지 (민감도 확인용). 기본 끔.
  emulate_debug_markers: false

# ---------------------------------------------------------------------------
# launcher: yaml 설정 경로가 없는 A30 키 — 컨트롤러 · 솔버 생성 인자. convex_mpc.py 가 읽어 engine 에 넘긴다.
# ---------------------------------------------------------------------------
launcher:
  profile: ramp          # A30 profile — 걷기 시작 후 2 s 동안 명령을 올린다 (const = 처음부터)
  fixes: [half, yawref]  # A30 fix — half: 지평 접촉표 원점을 한 걸음마다 옮김 / yawref: MPC yaw 참조 = 명령 적분 yaw
  foot_model: line       # A30 foot — OA-MPC 선 접촉 (Mx = 0 등식 + 12 행 부등식)
  raibert_gain: 0.2      # A30 rai — 착지점 Raibert 항 Δp = K·(v_실측 − v_명령), K [s], 최대 10 cm
  ypath: 0.3             # A30 ypath — MPC 옆 위치 참조를 경로선 쪽으로 30 %
  arm_swing: 0.3         # A30 armsw — 팔 반대 흔들기 [rad/m]
  osqp:                  # MPC QP 풀이 (OSQP). σ 1e-6 · α 1.6 · Ruiz 10 은 mpc.py 기본값
    fixed_iter: 25       # A30 admm — 걷기 ADMM 고정 25 회 (논문 N_QP). 적응 ρ · 종료 판정 끔
    fixed_iter_stand: 50 # A30 admms — 서기 50 회
    rho: 5.0e-5          # A30 rho — ADMM ρ (OSQP 기본 0.1)
    init: warm           # A30 init — 직전 해를 한 칸 밀어 시작점으로 (nominal = 논문식 공칭 자세)
